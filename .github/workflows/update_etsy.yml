name: Update Etsy Products

on:
  schedule:
    - cron: '0 * * * *' # Gira al minuto 0 di ogni singola ora
  workflow_dispatch: # Ti permette di farlo partire a mano quando vuoi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' # Corretto: prima era "python-directory"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Etsy Data
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          python .github/scripts/fetch_etsy.py

      - name: Commit and push if changed
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add prodotti_etsy.json # Corretto: ora salva il file giusto!
          git commit -m "Update products from Etsy" || exit 0
          git push
